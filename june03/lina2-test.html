        <script>
            const applyBtn = document.getElementById('applyBtn');
            const docHeader = document.getElementById('docHeader');
            const docBody = document.getElementById('docBody');
            const sspInput = document.getElementById('linaSspInput');
            const renderArea = document.getElementById('renderArea');
            const maximizeAdBtn = document.getElementById('maximizeAdBtn');
            const sdkLogPre = document.getElementById('sdkLogPre');
            const sdkLogClearBtn = document.getElementById('sdkLogClearBtn');
            let isAdMaximized = false;
            let originalAdSize = null;
            let latestBidSize = null;

            const SDK_LOG_MAX_LINES = 300;
            const sdkLogLines = [];

            function safeStringify(value) {
                if (value === undefined) return 'undefined';
                if (value === null) return 'null';
                if (typeof value === 'string') return value;
                if (value instanceof Error) return `${value.name}: ${value.message}`;
                try {
                    return JSON.stringify(value);
                } catch (e) {
                    return String(value);
                }
            }

            function appendSdkLog(level, message, extra) {
                if (!sdkLogPre) return;
                const time = new Date().toLocaleTimeString();
                const extraText = extra !== undefined ? ` | ${safeStringify(extra)}` : '';
                const line = `[${time}] [${level.toUpperCase()}] ${message}${extraText}`;
                sdkLogLines.push(line);
                if (sdkLogLines.length > SDK_LOG_MAX_LINES) sdkLogLines.shift();
                sdkLogPre.textContent = sdkLogLines.join('\n') || 'SDK 로그 대기 중...';
                sdkLogPre.scrollTop = sdkLogPre.scrollHeight;
            }

            function shouldCaptureSdkLog(args) {
                const keywords = [
                    '[LinaAds',
                    '[LinaAdsContent]',
                    '[LinaAdsComponent]',
                    '[getAdToken]',
                    '[login]',
                    'lina-ads',
                    'linaSDKLoaded',
                    'adsLoaded',
                    'adsError',
                    'adsPointsEarned',
                    'MiniKit',
                    'network',
                    'Network',
                    'fetch',
                    'Fetch',
                    'CORS',
                    'cors',
                    'Bid',
                    'bid',
                    'ssp',
                    'openrtb',
                    'XHR',
                    'xhr',
                    'timeout',
                    'Timeout',
                ];

                return args.some((arg) => {
                    const text = typeof arg === 'string' ? arg : safeStringify(arg);
                    return keywords.some((keyword) => text.includes(keyword));
                });
            }

            function setupSdkLogger() {
                const originalConsole = {
                    log: console.log.bind(console),
                    info: console.info.bind(console),
                    warn: console.warn.bind(console),
                    error: console.error.bind(console),
                };

                ['log', 'info', 'warn', 'error'].forEach((level) => {
                    const original = originalConsole[level];
                    console[level] = function (...args) {
                        try {
                            if (shouldCaptureSdkLog(args)) {
                                const message = args.map((arg) => safeStringify(arg)).join(' ');
                                appendSdkLog(level, message);
                            }
                        } catch (e) {
                            /* ignore logger errors */
                        }
                        return original(...args);
                    };
                });

                window.addEventListener('linaSDKLoaded', () => appendSdkLog('info', 'Event: linaSDKLoaded'));
                window.addEventListener('adsLoaded', (event) => appendSdkLog('info', 'Event: adsLoaded', event && event.detail));
                window.addEventListener('adsError', (event) => appendSdkLog('error', 'Event: adsError', event && event.detail));
                window.addEventListener('adsPointsEarned', (event) => appendSdkLog('info', 'Event: adsPointsEarned', event && event.detail));
            }

            function logRunningContext() {
                let isInIframe = false;
                try {
                    isInIframe = window.self !== window.top;
                } catch (e) {
                    // 크로스 오리진 iframe에서는 window.top 접근 자체가 막힐 수 있음 (이 또한 의미있는 신호)
                    isInIframe = true;
                }

                let ancestorOrigins = null;
                try {
                    if (window.location.ancestorOrigins && window.location.ancestorOrigins.length) {
                        ancestorOrigins = Array.from(window.location.ancestorOrigins);
                    }
                } catch (e) {
                    /* not supported in this browser */
                }

                appendSdkLog('info', '[Context] location.href', window.location.href);
                appendSdkLog('info', '[Context] location.origin', window.location.origin);
                appendSdkLog('info', '[Context] document.referrer', document.referrer || '(none)');
                appendSdkLog('info', '[Context] isInIframe (self !== top)', isInIframe);
                appendSdkLog('info', '[Context] ancestorOrigins', ancestorOrigins || '(unsupported or none)');
                appendSdkLog('info', '[Context] userAgent', navigator.userAgent);
            }

            function setupGlobalErrorLogger() {
                window.addEventListener('error', (event) => {
                    appendSdkLog('error', '[GlobalError]', {
                        message: event.message,
                        filename: event.filename,
                        lineno: event.lineno,
                        colno: event.colno,
                        errorName: event.error && event.error.name,
                        errorMessage: event.error && event.error.message,
                    });
                });
                window.addEventListener('unhandledrejection', (event) => {
                    const reason = event.reason;
                    appendSdkLog('error', '[UnhandledRejection]', {
                        errorName: reason && reason.name,
                        errorMessage: (reason && reason.message) || safeStringify(reason),
                    });
                });
            }

            if (sdkLogClearBtn) {
                sdkLogClearBtn.addEventListener('click', () => {
                    sdkLogLines.length = 0;
                    if (sdkLogPre) sdkLogPre.textContent = 'SDK 로그 대기 중...';
                });
            }

            setupSdkLogger();
            logRunningContext();
            setupGlobalErrorLogger();

            // --- Bid Interceptor ---
            let _fetchOriginal = null;
            let _xhrOpenOriginal = null;
            let _xhrSendOriginal = null;

            function teardownBidInterceptor() {
                if (_fetchOriginal) {
                    window.fetch = _fetchOriginal;
                    _fetchOriginal = null;
                }
                if (_xhrOpenOriginal) {
                    XMLHttpRequest.prototype.open = _xhrOpenOriginal;
                    _xhrOpenOriginal = null;
                }
                if (_xhrSendOriginal) {
                    XMLHttpRequest.prototype.send = _xhrSendOriginal;
                    _xhrSendOriginal = null;
                }
            }

            // fetch를 안 쓰고 XMLHttpRequest로 요청하는 SDK/브릿지 환경을 위한 보조 감시.
            function setupXhrBidInterceptor(sspHostname) {
                _xhrOpenOriginal = XMLHttpRequest.prototype.open;
                _xhrSendOriginal = XMLHttpRequest.prototype.send;

                XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                    try {
                        this.__linaIsTarget = new URL(url, window.location.href).hostname === sspHostname;
                        this.__linaUrl = url;
                        this.__linaMethod = method;
                    } catch (e) {
                        this.__linaIsTarget = false;
                    }
                    return _xhrOpenOriginal.call(this, method, url, ...rest);
                };

                XMLHttpRequest.prototype.send = function (body) {
                    if (this.__linaIsTarget) {
                        // Capture request headers
                        const reqPre = document.getElementById('bidRequestPre');
                        const resPre = document.getElementById('bidResponsePre');
                        reqPre.textContent = `요청 대기 중...\nMethod: ${this.__linaMethod}\nURL: ${this.__linaUrl}`;
                        resPre.textContent = '응답 대기 중...';

                        appendSdkLog('info', '[Bid][XHR] request', { method: this.__linaMethod, url: this.__linaUrl, body });

                        // Capture response headers
                        this.addEventListener('readystatechange', function () {
                            if (this.readyState === XMLHttpRequest.HEADERS_RECEIVED) {
                                try {
                                    const respHeaders = this.getAllResponseHeaders()
                                        .split('\n')
                                        .map((h) => h.trim())
                                        .filter(Boolean)
                                        .reduce((acc, line) => {
                                            const idx = line.indexOf(':');
                                            if (idx > 0) {
                                                const key = line.substring(0, idx).trim();
                                                const val = line.substring(idx + 1).trim();
                                                acc[key] = val;
                                            }
                                            return acc;
                                        }, {});
                                    appendSdkLog('info', '[Bid][XHR] response headers', respHeaders);
                                } catch (e) {
                                    /* ignore header parse errors */
                                }
                            }
                        });

                        this.addEventListener('loadend', () => {
                            try {
                                let respBody = this.responseText || '(응답 없음)';
                                let respDisplay = respBody;
                                try {
                                    respDisplay = JSON.stringify(JSON.parse(respBody), null, 2);
                                } catch {
                                    respDisplay = respBody;
                                }
                                resPre.textContent = `상태: ${this.status} ${this.statusText}\nURL: ${this.__linaUrl}\n\n${respDisplay}`;
                            } catch (e) {
                                resPre.textContent = `상태: ${this.status} ${this.statusText}\n응답 본문 읽기 실패`;
                            }
                            appendSdkLog(this.status >= 200 && this.status < 300 ? 'info' : 'warn', '[Bid][XHR] response', {
                                url: this.__linaUrl,
                                status: this.status,
                                statusText: this.statusText,
                                responseURL: this.responseURL,
                            });
                        });
                        this.addEventListener('error', () => {
                            resPre.textContent = `fetch 실패: 네트워크 오류\n(CORS 차단 또는 네트워크 오류 가능성)`;
                            appendSdkLog('error', '[Bid][XHR] network error (CORS 차단 가능성 - 상세 사유 비공개)', { url: this.__linaUrl });
                        });
                    }
                    return _xhrSendOriginal.call(this, body);
                };
            }

            function setupBidInterceptor(sspBaseUrl) {
                teardownBidInterceptor();
                let sspHostname;
                try {
                    sspHostname = new URL(sspBaseUrl).hostname;
                } catch (e) {
                    return;
                }

                const reqPre = document.getElementById('bidRequestPre');
                const resPre = document.getElementById('bidResponsePre');
                reqPre.textContent = '요청 대기 중...';
                resPre.textContent = '응답 대기 중...';

                setupXhrBidInterceptor(sspHostname);

                _fetchOriginal = window.fetch.bind(window);

                window.fetch = async function (input, init, ...rest) {
                    const url = input instanceof Request ? input.url : String(input);
                    let isTarget = false;
                    try {
                        isTarget = new URL(url).hostname === sspHostname;
                    } catch (e) {}

                    if (isTarget) {
                        const reqPre = document.getElementById('bidRequestPre');
                        const resPre = document.getElementById('bidResponsePre');
                        reqPre.textContent = '요청 대기 중...';
                        resPre.textContent = '응답 대기 중...';

                        // Build request info
                        const requestHeaders = {};
                        if (init && init.headers) {
                            if (typeof init.headers === 'object' && !Array.isArray(init.headers)) {
                                Object.keys(init.headers).forEach((k) => {
                                    requestHeaders[k] = init.headers[k];
                                });
                            } else if (Array.isArray(init.headers)) {
                                init.headers.forEach((h) => {
                                    requestHeaders[h[0]] = h[1];
                                });
                            }
                        }

                        // Capture BidRequest body
                        let requestBody = null;
                        if (init && init.body != null) {
                            try {
                                let bodyStr =
                                    typeof init.body === 'string'
                                        ? init.body
                                        : init.body instanceof ArrayBuffer
                                          ? new TextDecoder().decode(init.body)
                                          : init.body instanceof Blob
                                            ? await init.body.text()
                                            : JSON.stringify(init.body);
                                requestBody = bodyStr;
                                let displayBody = bodyStr;
                                try {
                                    displayBody = JSON.stringify(JSON.parse(bodyStr), null, 2);
                                } catch {
                                    displayBody = bodyStr;
                                }
                                const pageOrigin = window.location.origin;
                                // Origin과 Referer는 브라우저가 자동으로 추가하는 헤더
                                let reqOrigin = requestHeaders['origin'] || requestHeaders['Origin'];
                                let reqReferer = requestHeaders['referer'] || requestHeaders['Referer'];

                                if (!reqOrigin) {
                                    reqOrigin = pageOrigin; // 브라우저가 자동으로 추가
                                }
                                if (!reqReferer) {
                                    reqReferer = document.referrer || pageOrigin; // 브라우저가 자동으로 추가
                                }

                                reqPre.textContent = `=== Origin 정보 ===\n현재 페이지: ${pageOrigin}\nRequest Origin: ${reqOrigin}\nReferer: ${reqReferer}\n\nMethod: ${init && init.method ? init.method.toUpperCase() : 'GET'}\nURL: ${url}\n\nHeaders:\n${JSON.stringify(requestHeaders, null, 2)}\n\nBody:\n${displayBody}`;
                            } catch (e) {
                                reqPre.textContent = '요청 본문을 읽을 수 없습니다.';
                            }
                        } else if (input instanceof Request) {
                            try {
                                const cloned = input.clone();
                                const bodyStr = await cloned.text();
                                requestBody = bodyStr;
                                let displayBody = bodyStr;
                                try {
                                    displayBody = JSON.stringify(JSON.parse(bodyStr), null, 2);
                                } catch {
                                    displayBody = bodyStr;
                                }
                                const pageOrigin = window.location.origin;
                                // Request 객체에서 헤더 직접 추출
                                let reqOrigin = requestHeaders['origin'] || requestHeaders['Origin'];
                                let reqReferer = requestHeaders['referer'] || requestHeaders['Referer'];

                                // Request 객체가 있으면 여기서 헤더 다시 확인
                                if (input.headers) {
                                    if (!reqOrigin && input.headers.get) {
                                        reqOrigin = input.headers.get('origin');
                                    }
                                    if (!reqReferer && input.headers.get) {
                                        reqReferer = input.headers.get('referer');
                                    }
                                }

                                if (!reqOrigin) reqOrigin = pageOrigin;
                                if (!reqReferer) reqReferer = document.referrer || pageOrigin;

                                reqPre.textContent = `=== Origin 정보 ===\n현재 페이지: ${pageOrigin}\nRequest Origin: ${reqOrigin}\nReferer: ${reqReferer}\n\nMethod: ${input.method || 'GET'}\nURL: ${url}\n\nHeaders:\n${JSON.stringify(requestHeaders, null, 2)}\n\nBody:\n${displayBody}`;
                            } catch (e) {
                                reqPre.textContent = '요청 본문을 읽을 수 없습니다.';
                            }
                        } else {
                            const pageOrigin = window.location.origin;
                            let reqOrigin = requestHeaders['origin'] || requestHeaders['Origin'];
                            let reqReferer = requestHeaders['referer'] || requestHeaders['Referer'];

                            if (!reqOrigin) reqOrigin = pageOrigin;
                            if (!reqReferer) reqReferer = document.referrer || pageOrigin;

                            reqPre.textContent = `=== Origin 정보 ===\n현재 페이지: ${pageOrigin}\nRequest Origin: ${reqOrigin}\nReferer: ${reqReferer}\n\nMethod: GET\nURL: ${url}\n\nBody: (없음)`;
                        }

                        let response;
                        try {
                            response = await _fetchOriginal(input, init, ...rest);
                        } catch (fetchError) {
                            // fetch()가 reject되는 경우만 CORS 차단(또는 네트워크 단절)으로 볼 수 있음.
                            // 이 경우 브라우저는 응답 상태/본문을 전혀 노출하지 않음.
                            appendSdkLog('error', '[Bid] fetch failed (CORS 차단 가능성 - 응답 자체를 못 받음)', {
                                url,
                                origin: window.location.origin,
                                errorName: fetchError && fetchError.name,
                                errorMessage: fetchError && fetchError.message,
                            });
                            resPre.textContent = `fetch 실패: ${fetchError && fetchError.message}\n(CORS 차단 또는 네트워크 오류 가능성)`;
                            throw fetchError;
                        }

                        // 주의: fetch가 Response 객체를 반환했다는 것 자체가 CORS 검사를 통과했다는 뜻.
                        // (통과 못하면 위 catch에서 TypeError로 reject됨)
                        // response.headers.get('access-control-allow-origin')은 브라우저가 노출하지 않는
                        // 헤더라 항상 null이 찍히므로 CORS 판단 근거로 쓸 수 없음 — 대신 아래 필드로 진단.
                        appendSdkLog(response.ok ? 'info' : 'warn', '[Bid] response status', {
                            url,
                            status: response.status,
                            responseUrl: response.url,
                            redirected: response.redirected,
                            type: response.type,
                        });

                        // Capture response headers
                        const responseHeaders = {};
                        response.headers.forEach((value, key) => {
                            responseHeaders[key] = value;
                        });

                        const cloned = response.clone();
                        try {
                            const respStr = await cloned.text();
                            let respDisplay = respStr;
                            try {
                                respDisplay = JSON.stringify(JSON.parse(respStr), null, 2);
                                const bid = JSON.parse(respStr)?.seatbid?.[0]?.bid?.[0];
                                if (Number(bid?.w) > 0 && Number(bid?.h) > 0) {
                                    latestBidSize = { width: Number(bid.w), height: Number(bid.h) };
                                }
                            } catch {
                                respDisplay = respStr || '(응답 없음)';
                            }
                            resPre.textContent = `Status: ${response.status} ${response.statusText}\nURL: ${response.url}\n\nHeaders:\n${JSON.stringify(responseHeaders, null, 2)}\n\nBody:\n${respDisplay}`;
                        } catch (e) {
                            resPre.textContent = `Status: ${response.status} ${response.statusText}\n응답 본문 읽기 실패`;
                        }
                        return response;
                    }

                    return _fetchOriginal(input, init, ...rest);
                };
            }

            function ensureScriptInHead(scriptHtml) {
                return new Promise((resolve) => {
                    try {
                        const div = document.createElement('div');
                        div.innerHTML = scriptHtml;
                        const script = div.querySelector('script');
                        if (script && script.src) {
                            const newSrc = script.src;
                            const existing = document.querySelector('script[data-lina-loader]');
                            if (existing) existing.remove();

                            try {
                                const scripts = Array.from(document.querySelectorAll('script[src]'));
                                scripts.forEach((sc) => {
                                    try {
                                        const sSrc = sc.src || '';
                                        if (/script(\.min)?\.js(\?|$)/i.test(sSrc) || /loader(\.min)?\.js(\?|$)/i.test(sSrc)) {
                                            sc.remove();
                                        }
                                    } catch (e) {
                                        /* ignore per-script errors */
                                    }
                                });
                            } catch (e) {
                                /* ignore */
                            }

                            let url;
                            try {
                                url = new URL(newSrc, window.location.href);
                            } catch (e) {
                                url = { toString: () => newSrc, searchParams: { set: () => {} } };
                            }
                            if (url.searchParams) url.searchParams.set('_cb', Date.now().toString());

                            const s = document.createElement('script');
                            s.src = url.toString();
                            s.setAttribute('data-lina-loader', '');
                            s.async = false;
                            s.addEventListener('load', () => resolve());
                            s.addEventListener('error', () => resolve());
                            document.head.appendChild(s);
                            setTimeout(() => {}, 0);
                            return;
                        }
                    } catch (e) {
                        /* ignore parse errors */
                    }
                    resolve();
                });
            }

            function replaceSspUrlInPublisherSetup(bodyHtml, sspUrl) {
                try {
                    return bodyHtml.replace(/publisherSetup=('|\")([\s\S]*?)(\1)/, (m, q, jsonStr) => {
                        let cleaned = jsonStr.replace(/\\'/g, "'");
                        try {
                            const obj = JSON.parse(cleaned);
                            // Only overwrite sspUrl when a non-empty value is provided
                            if (sspUrl) obj.sspUrl = sspUrl;
                            const newJson = JSON.stringify(obj);
                            return `publisherSetup=${q}${newJson}${q}`;
                        } catch (e) {
                            return m;
                        }
                    });
                } catch (e) {
                    return bodyHtml;
                }
            }

            // Extract sspUrl from publisherSetup attribute inside a lina-ads block in docBody
            function extractPublisherSspFromDocBody(bodyHtml) {
                try {
                    const m = bodyHtml.match(/publisherSetup=(['"])([\s\S]*?)\1/);
                    if (!m) return '';
                    const jsonStr = m[2].replace(/\\'/g, "'");
                    const obj = JSON.parse(jsonStr);
                    return obj && obj.sspUrl ? obj.sspUrl : '';
                } catch (e) {
                    return '';
                }
            }

            function waitForCustomElement(tagName, timeout = 5000) {
                if (window.customElements && window.customElements.get(tagName)) return Promise.resolve();
                if (window.customElements && window.customElements.whenDefined) {
                    return Promise.race([window.customElements.whenDefined(tagName), new Promise((res) => setTimeout(res, timeout))]);
                }
                return new Promise((resolve) => {
                    const start = Date.now();
                    const iv = setInterval(() => {
                        if (window.customElements && window.customElements.get(tagName)) {
                            clearInterval(iv);
                            resolve();
                        }
                        if (Date.now() - start > timeout) {
                            clearInterval(iv);
                            resolve();
                        }
                    }, 50);
                });
            }

            // Update the userInfo attribute inside the docBody textarea based on current user settings
            function updateDocBodyUserInfo() {
                const wallet = document.getElementById('walletInput').value.trim();
                const humanVerified = (document.getElementById('humanVerified').value || '').toString().toLowerCase() === 'y';

                const userInfoObj = {
                    wallet_address: wallet || '0x1234abcd',
                    userOrbVerified: humanVerified,
                };
                const body = docBody.value;

                // parse existing other attributes so we can rebuild full normalized block
                const existingPubMatch = body.match(/publisherSetup=(['"])([\s\S]*?)\1/);
                const existingAdMatch = body.match(/adConfig=(['"])([\s\S]*?)\1/);
                const existingPointMatch = body.match(/pointBtnUrl=(['"])([\s\S]*?)\1/);

                let existingPub = {};
                if (existingPubMatch) {
                    try {
                        existingPub = JSON.parse(existingPubMatch[2]);
                    } catch (e) {
                        existingPub = {};
                    }
                }

                let existingAd = {};
                if (existingAdMatch) {
                    try {
                        existingAd = JSON.parse(existingAdMatch[2]);
                    } catch (e) {
                        existingAd = {};
                    }
                }

                const existingPoint = existingPointMatch ? existingPointMatch[2] : '';

                // merge existing userInfo with inputs
                const firstMatch = body.match(/userInfo=(['"])([\s\S]*?)\1/);
                let existingUser = {};
                if (firstMatch) {
                    try {
                        existingUser = JSON.parse(firstMatch[2]);
                    } catch (e) {
                        existingUser = {};
                    }
                }
                const mergedUser = Object.assign({}, existingUser, userInfoObj);

                docBody.value = normalizeAndBuildLinaAds(body, mergedUser, existingPub, existingAd, existingPoint);
            }

            // Update lina-related attributes inside docBody (publisherSetup, adConfig, pointBtnUrl)
            function updateDocBodyLinaSettings() {
                const appKey = document.getElementById('linaAppKey').value.trim();
                const ssp = document.getElementById('linaSspInput').value.trim();
                const adDisplayId = document.getElementById('linaAdDisplayId').value.trim();
                const pointUrl = '';
                // Use normalized replacement to keep the exact format and update values
                const body = docBody.value;
                // parse existing attrs
                const existingUserMatch = body.match(/userInfo=(['"])([\s\S]*?)\1/);
                const existingPubMatch = body.match(/publisherSetup=(['"])([\s\S]*?)\1/);
                const existingAdMatch = body.match(/adConfig=(['"])([\s\S]*?)\1/);
                const existingPointMatch = body.match(/pointBtnUrl=(['"])([\s\S]*?)\1/);

                let publisherObj = {};
                if (existingPubMatch) {
                    try {
                        publisherObj = JSON.parse(existingPubMatch[2]);
                    } catch (e) {
                        publisherObj = {};
                    }
                }
                if (appKey) publisherObj.appKey = appKey;
                if (ssp) publisherObj.sspUrl = ssp;

                let adObj = {};
                if (existingAdMatch) {
                    try {
                        adObj = JSON.parse(existingAdMatch[2]);
                    } catch (e) {
                        adObj = {};
                    }
                }
                if (adDisplayId) adObj.adDisplayId = adDisplayId;

                const pointBtn = pointUrl || (existingPointMatch ? existingPointMatch[2] : '');

                // determine existing userInfo to preserve other fields
                let existingUser = {};
                if (existingUserMatch) {
                    try {
                        existingUser = JSON.parse(existingUserMatch[2]);
                    } catch (e) {
                        existingUser = {};
                    }
                }
                const mergedUser = Object.assign({}, existingUser, { wallet_address: existingUser.wallet_address || userInfoObjFromInputs().wallet_address });

                const mergedUserFinal = Object.assign({}, mergedUser);
                // but apply explicit values from form
                mergedUserFinal.wallet_address = document.getElementById('walletInput').value.trim() || mergedUserFinal.wallet_address || '0x1234abcd';
                mergedUserFinal.userOrbVerified = (document.getElementById('humanVerified').value || '').toString().toLowerCase() === 'y';

                docBody.value = normalizeAndBuildLinaAds(body, mergedUserFinal, publisherObj, adObj, pointBtn);
            }

            // helper to get a userInfo object from current inputs
            function userInfoObjFromInputs() {
                return {
                    wallet_address: document.getElementById('walletInput').value.trim() || '0x1234abcd',
                    userOrbVerified: (document.getElementById('humanVerified').value || '').toString().toLowerCase() === 'y',
                };
            }

            // Build a normalized <lina-ads> block and replace the first occurrence
            function normalizeAndBuildLinaAds(body, userObj, publisherObj, adObj, pointBtnUrl) {
                const userJson = JSON.stringify(userObj);
                const pubJson = JSON.stringify(publisherObj || {});
                const adJson = JSON.stringify(adObj || {});
                const pointVal = pointBtnUrl || '';

                // Build block - only include pointBtnUrl if it has a value
                let block = `<lina-ads\n    userInfo='${userJson}'\n    publisherSetup='${pubJson}'\n    adConfig='${adJson}'`;
                if (pointVal) {
                    block += `\n    pointBtnUrl="${pointVal}"`;
                }
                block += `\n    >\n</lina-ads>`;

                if (/<lina-ads\b[\s\S]*?<\/lina-ads>/.test(body)) {
                    return body.replace(/<lina-ads\b[\s\S]*?<\/lina-ads>/, block);
                }
                // if not found, prepend
                return block + '\n' + body;
            }

            function renderBodyWithoutReplacingAd(bodyHtml) {
                const template = document.createElement('template');
                template.innerHTML = bodyHtml;

                const nextAd = template.content.querySelector('lina-ads');
                const currentAd = renderArea.querySelector('lina-ads');
                if (currentAd && nextAd) {
                    const nextAttributes = new Set(Array.from(nextAd.attributes).map((attribute) => attribute.name));

                    Array.from(currentAd.attributes).forEach((attribute) => {
                        if (!nextAttributes.has(attribute.name)) {
                            currentAd.removeAttribute(attribute.name);
                        }
                    });
                    Array.from(nextAd.attributes).forEach((attribute) => {
                        if (currentAd.getAttribute(attribute.name) !== attribute.value) {
                            currentAd.setAttribute(attribute.name, attribute.value);
                        }
                    });
                    if (typeof currentAd.loadAds === 'function') {
                        currentAd.loadAds();
                    }
                    return;
                }

                const initialAd = template.content.querySelector('lina-ads');
                if (initialAd) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'ad-scaled-wrapper';
                    initialAd.replaceWith(wrapper);
                    wrapper.appendChild(initialAd);
                }

                renderArea.replaceChildren(template.content.cloneNode(true));
            }

            async function applySettings() {
                const headerHtml = docHeader.value.trim();
                const bodyHtmlRaw = docBody.value.trim();

                // Allow users to paste/enter escaped entities (&lt; &gt;) or literal tags.
                const bodyHtmlDecoded = bodyHtmlRaw.replace(/&lt;/g, '<').replace(/&gt;/g, '>');

                // If docBody contains a publisherSetup.sspUrl, prefer it and update the input
                try {
                    const sspFromBody = extractPublisherSspFromDocBody(bodyHtmlDecoded);
                    if (sspFromBody) sspInput.value = sspFromBody;
                } catch (e) {
                    /* ignore */
                }

                const sspUrl = sspInput.value.trim();

                setupBidInterceptor(sspUrl);

                await ensureScriptInHead(headerHtml);
                await waitForCustomElement('lina-ads', 5000);

                const bodyHtml = replaceSspUrlInPublisherSetup(bodyHtmlDecoded, sspUrl);
                renderBodyWithoutReplacingAd(bodyHtml);

                setTimeout(() => {
                    isAdMaximized = false;
                    originalAdSize = null;
                    latestBidSize = null;
                    renderArea.style.backgroundColor = '';
                    renderArea.style.overflowX = 'auto';
                    if (maximizeAdBtn) {
                        maximizeAdBtn.style.display = 'none';
                        maximizeAdBtn.textContent = '원본 크기로 보기';
                    }

                    // Apply responsive scaling to fit renderArea
                    setTimeout(() => {
                        scaleAdToFitRenderArea();
                    }, 100);
                }, 50);
            }

            function getOriginalAdSize(linaAds) {
                const root = linaAds.shadowRoot;
                if (!root) return null;

                let width = 0;
                let height = 0;
                root.querySelectorAll('*').forEach((element) => {
                    const elementWidth = parseFloat(element.style.width);
                    const elementHeight = parseFloat(element.style.height);
                    if (Number.isFinite(elementWidth)) width = Math.max(width, elementWidth);
                    if (Number.isFinite(elementHeight)) height = Math.max(height, elementHeight);
                });

                return width > 0 && height > 0 ? { width, height } : null;
            }

            function setAdHostSize(linaAds, width, height) {
                linaAds.style.setProperty('width', `${width}px`, 'important');
                linaAds.style.setProperty('height', `${height}px`, 'important');
                linaAds.style.boxSizing = 'border-box';
            }

            // Scale the bid creative to the render area without changing its aspect ratio.
            function scaleAdToFitRenderArea() {
                try {
                    const linaAds = renderArea.querySelector('lina-ads');
                    if (!linaAds) return;

                    const adSize = getOriginalAdSize(linaAds) || latestBidSize;
                    if (!adSize) {
                        setTimeout(scaleAdToFitRenderArea, 100);
                        return;
                    }
                    originalAdSize = adSize;

                    const renderRect = renderArea.getBoundingClientRect();
                    const renderPadding = window.getComputedStyle(renderArea).padding;
                    const paddingValue = parseFloat(renderPadding) || 12;
                    const availWidth = renderRect.width - paddingValue * 2;

                    const requiresScaling = adSize.width > availWidth;
                    renderArea.style.backgroundColor = adSize.width < availWidth ? '#000' : '';
                    if (maximizeAdBtn) {
                        maximizeAdBtn.style.display = requiresScaling ? 'inline-block' : 'none';
                        if (!requiresScaling && isAdMaximized) {
                            isAdMaximized = false;
                            maximizeAdBtn.textContent = '원본 크기로 보기';
                        }
                    }

            async function lookupLedgerBalance() {
                const issuer = document.getElementById('issuerInput').value.trim();
                const holder = document.getElementById('holderInput').value.trim();
                const keyId = document.getElementById('keyIdInput').value.trim();
                const pem = document.getElementById('pemInput').value.trim();
                const out = document.getElementById('balanceOutput');
                if (!issuer || !holder || !keyId || !pem) {
                    setLedgerTrafficLight('red', '모든 필드를 확인하세요.');
                    if (out) out.textContent = '';
                    return;
                }
                setLedgerTrafficLight('', '조회 중...');
                if (out) out.textContent = '';
                try {
                    // dynamic import of jose for browser
                    const jose = await import('https://cdn.jsdelivr.net/npm/jose@4.14.4/dist/browser/index.min.js');
                    const { SignJWT, importPKCS8 } = jose;
                    const privateKey = await importPKCS8(pem, 'ES256');
                    const now = Math.floor(Date.now() / 1000);
                    const jwt = await new SignJWT({ iss: issuer, aud: 'lina-point-ledger', iat: now, exp: now + 300 })
                        .setProtectedHeader({ alg: 'ES256', kid: keyId })
                        .sign(privateKey);

                    const envVal = (document.querySelector('input[name="env"]:checked') || { value: localStorage.getItem('lina2.saved.env') || 'dev' }).value;
                    const BASE_URL =
                        envVal === 'prd'
                            ? 'https://pl-api.web3lina.com'
                            : envVal === 'stg'
                              ? 'https://pl-api.stg.web3lge.com'
                              : 'https://pl-api.dev.web3lge.com';
                    const url = `${BASE_URL}/v1/holders/${encodeURIComponent(holder)}/balance`;
                    const res = await fetch(url, { headers: { Authorization: `Bearer ${jwt}` } });
                    if (res.status === 404) {
                        // 신규 유저로 간주: 조회 성공(밸런스 0)
                        if (out) out.textContent = '0';
                        setLedgerTrafficLight('green', '조회 성공 (신규 유저)');
                        return;
                    }
                    if (!res.ok) throw new Error(`조회 실패: ${res.status} ${res.statusText}`);
                    const data = await res.json();

                    // Try to extract balance value from common response shapes
                    let balance = null;
                    try {
                        if (data == null) balance = null;
                        else if (typeof data === 'number' || typeof data === 'string') balance = data;
                        else if ('balance' in data) balance = data.balance;
                        else if ('balanceResponse' in data) balance = data.balanceResponse;
                        else if (data.data && 'balance' in data.data) balance = data.data.balance;
                        else if (Array.isArray(data.balances) && data.balances.length > 0) {
                            const b0 = data.balances[0];
                            balance = (b0 && (b0.balance || b0.amount || b0.value)) || b0;
                        }
                    } catch (e) {
                        balance = null;
                    }

                    if (out) out.textContent = balance !== null && balance !== undefined ? String(balance) : JSON.stringify(data) || '';
                    setLedgerTrafficLight('green', '조회 성공');
                } catch (e) {
                    if (out) out.textContent = '';
                    setLedgerTrafficLight('red', e && e.message ? e.message : '오류');
                }
            }

            function parseOpt1(val) {
                const [genderRaw, ageRange] = val.split('/');
                let gender = genderRaw;
                if (typeof genderRaw === 'string') {
                    const g = genderRaw.trim().toLowerCase();
                    if (g.startsWith('m')) gender = 'M';
                    else if (g.startsWith('f')) gender = 'F';
                }
                const currentYear = new Date().getFullYear();
                let firstAge;
                if (ageRange && ageRange.startsWith('over')) {
                    firstAge = parseInt(ageRange.replace('over', ''), 10);
                } else if (ageRange && ageRange.includes('-')) {
                    firstAge = parseInt(ageRange.split('-')[0], 10);
                } else {
                    firstAge = parseInt(ageRange, 10) || 30;
                }
                return { gender, yob: currentYear - firstAge };
            }

                    const envVal = (document.querySelector('input[name="env"]:checked') || { value: localStorage.getItem('lina2.saved.env') || 'dev' }).value;
                    const apiBase =

                    if (!irsRes.ok) throw new Error(`/irs 오류: ${irsRes.status} ${irsRes.statusText}`);

                    // Step 2: Build demographics payload

                    // Step 3: Update the docBody textarea to reflect user settings
                    updateDocBodyUserInfo();

                    // Persist updated settings
                    persistSettingsToLocal();

                    setTrafficLight('green', '설정 완료');
                } catch (err) {
                    setTrafficLight('red', err.message || '오류 발생');
                } finally {
                    setBtn.disabled = false;
                }
            });

            // Reset all inputs and localStorage to defaults
            function resetAllSettings() {
                try {
                    // determine selected env
                    const sel = (document.querySelector('input[name="env"]:checked') || { value: localStorage.getItem('lina2.saved.env') || 'dev' }).value;

                    // Defaults per env
                    const headerDev = '<scr' + 'ipt src="https://cdn.dev.web3lge.com/mock/sdk/js/loader.js?sdk_module=inventory"></scr' + 'ipt>';
                    const bodyDev =
                        '<lina-ads\n    userInfo=\'{"wallet_address":"0x1234abcd","userOrbVerified":true}\'\n    publisherSetup=\'{"appKey":"your-app-key","sspUrl":"https://ssp-api.dev.web3lge.com"}\'\n    adConfig=\'{"adDisplayId":"718ec268-8096-49a3-bd79-36ac7af34818"}\'\n    >\n</lina-ads>';

                    const headerStg = '<scr' + 'ipt src="https://cdn.stg.web3lge.com/sdk/js/loader.js?sdk_module=inventory"></scr' + 'ipt>';
                    const bodyStg =
                        '<lina-ads\n    userInfo=\'{"wallet_address":"0x1234abcd","userOrbVerified":true}\'\n    publisherSetup=\'{"appKey":"your-app-key","sspUrl":"https://ssp-api.stg.web3lge.com"}\'\n    adConfig=\'{"adDisplayId":"718ec268-8096-49a3-bd79-36ac7af34818"}\'\n    >\n</lina-ads>';
                    const headerPrd = '<scr' + 'ipt src="https://cdn.web3lina.com/sdk/js/loader.js?sdk_module=inventory"></scr' + 'ipt>';
                    const bodyPrd =
                        '<lina-ads\n    userInfo=\'{"wallet_address":"0x1234abcd","userOrbVerified":true}\'\n    publisherSetup=\'{"appKey":"your-app-key","sspUrl":"https://ssp-api.web3lina.com"}\'\n    adConfig=\'{"adDisplayId":"718ec268-8096-49a3-bd79-36ac7af34818"}\'\n    >\n</lina-ads>';

                    // Clear inputs
                    const wa = document.getElementById('walletInput');
                    if (wa) wa.value = '';
                    const hv = document.getElementById('humanVerified');
                    if (hv) hv.value = 'Y';
                    const o1 = document.getElementById('opt1');
                    if (o1) o1.selectedIndex = 0;
                    const o2 = document.getElementById('opt2');
                    if (o2) o2.selectedIndex = 0;

                    const lap = document.getElementById('linaAppKey');
                    if (lap) lap.value = '';
                    const lsp = document.getElementById('linaSspInput');
                    if (lsp) lsp.value = '';
                    const lad = document.getElementById('linaAdDisplayId');
                    if (lad) lad.value = '';
                    const lpt = document.getElementById('linaPointBtnUrl');
                    if (lpt) lpt.value = '';

                    // Reset doc header/body according to env
                    if (sel === 'prd') {
                        if (docHeader) docHeader.value = headerPrd;
                        if (docBody) docBody.value = bodyPrd;
                    } else if (sel === 'stg') {
                        if (docHeader) docHeader.value = headerStg;
                        if (docBody) docBody.value = bodyStg;
                    } else {
                        if (docHeader) docHeader.value = headerDev;
                        if (docBody) docBody.value = bodyDev;
                    }

                    // Clear all localStorage
                    try {
                        localStorage.clear();
                    } catch (e) {
                        /* ignore storage errors */
                    }

                    // Persist selected env marker
                    try {
                        localStorage.setItem('lina2.saved.env', sel);
                    } catch (e) {}

                    // Ensure radio reflects selection
                    const radio = document.querySelector(`input[name="env"][value="${sel}"]`);
                    if (radio) radio.checked = true;

                    try {
                        applyEnvironment(sel);
                    } catch (e) {
                        /* ignore */
                    }

                    // Clear status lights
                    setTrafficLight('', '');
                    setLinaTrafficLight('', '');

                    // Apply to render area so user sees reset content
                    //applySettings();
                } catch (e) {
                    console.error('resetAllSettings error', e);
                }
            }

            document.getElementById('resetBtn').addEventListener('click', () => {
                if (!confirm('설정값과 로컬 저장을 모두 초기화하시겠습니까?')) return;
                resetAllSettings();
            });
        </script>
    </body>
</html>
